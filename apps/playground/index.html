<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morphic Blocks — Playground</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <span class="brand">Morphic Blocks</span>
        <div id="mode-buttons">
          <button data-mode="iconic">Iconic</button>
          <button data-mode="lexical" class="active">Lexical</button>
          <button data-mode="syntactic">Syntactic</button>
        </div>
        <div id="header-actions">
          <button id="code-btn">Code</button>
          <button id="run-btn">Run Code</button>
        </div>
      </header>
      <main id="main">
        <aside id="toolbox-panel"></aside>
        <div id="workspace-area">
          <div id="editor-split">
            <div id="workspace-container"></div>
            <div id="code-editor"></div>
          </div>
          <div id="output-panel">
            <div id="output-header">
              <span>Output</span>
              <button id="clear-btn">Clear</button>
            </div>
            <pre id="output"></pre>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
