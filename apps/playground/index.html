<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morphic Blocks Playground</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <h1>Morphic Blocks Playground</h1>
          <p>
            Test Morphic wrapper features with independent toolbox/workspace modes,
            live code generation, and runnable block programs.
          </p>
        </div>
      </header>

      <main class="playground-layout">
        <section class="stage-card">
          <div class="mode-grid" aria-label="mode controls">
            <section class="mode-section mode-section-toolbox">
              <h2>Toolbox Mode</h2>
              <div id="toolbox-mode-buttons" class="mode-buttons" role="toolbar" aria-label="toolbox modes"></div>
            </section>

            <section class="mode-section mode-section-workspace">
              <h2>Workspace Mode</h2>
              <div id="workspace-mode-buttons" class="mode-buttons" role="toolbar" aria-label="workspace modes"></div>
            </section>
          </div>

          <div id="workspace"></div>
        </section>

        <aside class="side-stack">
          <section class="panel">
            <header class="panel-header">
              <h2>Generated JavaScript</h2>
              <div class="panel-actions">
                <button id="run-js" type="button">Run</button>
              </div>
            </header>
            <pre id="generated-output">JavaScript updates live as blocks change.</pre>
          </section>

          <section class="panel">
            <header class="panel-header">
              <h2>Run Output</h2>
              <button id="clear-output" type="button">Clear</button>
            </header>
            <pre id="run-output">Run output will appear here.</pre>
          </section>
        </aside>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
