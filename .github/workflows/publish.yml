name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build:package
      - run: bun run test
      - run: npm install -g npm@latest
      # A release tagged themes-v… publishes the themes package, any other the framework.
      - run: npm publish --provenance --access public
        working-directory: ${{ startsWith(github.event.release.tag_name, 'themes-') && 'packages/themes' || 'packages/morphic-blocks' }}
